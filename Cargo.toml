[package]
name = "slix"
version = "0.1.0"
edition = "2024"
description = "Spec-driven fixed-length message toolkit"
license = "MIT"
repository = "https://github.com/muhbrohim/slix"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
